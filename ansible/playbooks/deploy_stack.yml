---
- name: Deploy StudentSphere Stack
  hosts: studentsphere
  connection: local
  gather_facts: false

  tasks:
    - name: Deploy application and MongoDB using Docker Compose
      community.docker.docker_compose_v2:
        project_src: /project
        project_name: studentsphere
        state: present
        build: never
      register: compose_result

    - name: Display Compose deployment result
      debug:
        var: compose_result