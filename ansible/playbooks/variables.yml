---
- name: StudentSphere Container Variables
  hosts: studentsphere
  connection: local
  gather_facts: false

  vars:
    app_container: studentsphere-app
    db_container: studentsphere-mongodb
    monitoring_container: studentsphere-nagios

  tasks:
    - name: Display container names
      debug:
        msg:
          - "{{ app_container }}"
          - "{{ db_container }}"
          - "{{ monitoring_container }}"