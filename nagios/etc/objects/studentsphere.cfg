define host {
    use                     generic-host
    host_name               studentsphere-mongodb
    alias                   StudentSphere MongoDB
    address                 studentsphere-mongodb
    check_command           check-host-alive
    contact_groups          admins
    max_check_attempts     3
    check_interval          1
    retry_interval          1
}

define service {
    use                     generic-service
    host_name               studentsphere-mongodb
    service_description     MongoDB Health Check
    check_command           check_mongodb_health
    check_interval          1
    retry_interval          1
}